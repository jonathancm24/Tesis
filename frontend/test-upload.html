<!DOCTYPE html>
<html>
<head>
    <title>Prueba de Carga Masiva</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
    <h1>Prueba de Carga Masiva</h1>
    
    <h2>Crear plantilla Excel</h2>
    <button onclick="crearPlantilla()">Descargar Plantilla Excel</button>
    
    <h2>Probar carga</h2>
    <input type="file" id="fileInput" accept=".xlsx,.xls">
    <button onclick="probarCarga()">Probar Carga</button>
    
    <div id="resultado"></div>
    
    <script>
        function crearPlantilla() {
            // Datos de ejemplo
            const data = [
                {
                    nombre: 'Juan',
                    apellido: 'Pérez',
                    email: 'juan.perez@ejemplo.com',
                    tipoDocumento: 'CEDULA',
                    numeroDocumento: '1234567890',
                    fechaNacimiento: '1990-01-15',
                    role: 'estudiante'
                },
                {
                    nombre: 'María',
                    apellido: 'González',
                    email: 'maria.gonzalez@ejemplo.com',
                    tipoDocumento: 'CEDULA',
                    numeroDocumento: '0987654321',
                    fechaNacimiento: '1985-06-20',
                    role: 'profesor'
                }
            ];
            
            // Crear workbook
            const wb = XLSX.utils.book_new();
            const ws = XLSX.utils.json_to_sheet(data);
            
            // Agregar hoja al workbook
            XLSX.utils.book_append_sheet(wb, ws, 'Usuarios');
            
            // Descargar archivo
            XLSX.writeFile(wb, 'plantilla-usuarios.xlsx');
        }
        
        function probarCarga() {
            const fileInput = document.getElementById('fileInput');
            const file = fileInput.files[0];
            
            if (!file) {
                alert('Selecciona un archivo primero');
                return;
            }
            
            const token = localStorage.getItem('token');
            console.log('Token:', token);
            
            const formData = new FormData();
            formData.append('file', file);
            
            const headers = {};
            if (token) {
                headers['Authorization'] = `Bearer ${token}`;
            }
            
            fetch('http://localhost:3000/usuarios/bulk/validate-excel', {
                method: 'POST',
                headers: headers,
                body: formData
            })
            .then(response => {
                console.log('Response status:', response.status);
                return response.json();
            })
            .then(data => {
                console.log('Success:', data);
                document.getElementById('resultado').innerHTML = '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
            })
            .catch(error => {
                console.error('Error:', error);
                document.getElementById('resultado').innerHTML = '<p style="color: red;">Error: ' + error.message + '</p>';
            });
        }
    </script>
</body>
</html>
